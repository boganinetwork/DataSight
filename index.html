<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Observatory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Data Observatory</h1>
      <div style="display: flex; align-items: center; gap: 10px">
        <input
          type="color"
          id="theme-accent"
          value="#4d8cff"
          title="Warna aksen"
        />
        <button id="dashboard-toggle">Dashboard</button>
        <span class="status" id="status">memuat mesin query…</span>
      </div>
    </header>

    <div
      id="dashboard-view"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 50;
        padding: 20px;
        overflow: auto;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        "
      >
        <h2 style="font-size: 14px; margin: 0">Dashboard</h2>
        <button id="dashboard-close">✕ Tutup</button>
      </div>
      <div
        id="dashboard-grid"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
          gap: 14px;
        "
      ></div>
    </div>

    <div class="layout">
      <div class="sidebar">
        <div>
          <h2>Tabel</h2>
          <div id="file-list" style="margin-top: 8px"></div>
        </div>
        <button id="upload-btn">+ Upload CSV / JSON</button>
        <input type="file" id="file-input" accept=".csv,.json" multiple />
        <button id="save-project-btn">Save Project</button>
        <button id="load-project-btn">Load Project</button>
        <input
          type="file"
          id="project-input"
          accept=".json"
          style="display: none"
        />
      </div>

      <div class="main">
        <div class="card" style="flex: 0 0 auto">
          <h2>Query SQL</h2>
          <textarea
            id="sql"
            spellcheck="false"
            placeholder="select * from nama_tabel limit 100;"
          ></textarea>
          <div class="editor-footer">
            <select id="query-history" style="max-width: 200px">
              <option value="">Riwayat query…</option>
            </select>
            <span class="hint" id="table-hint">belum ada tabel</span>
            <button id="run-btn" disabled>Jalankan ▸</button>
          </div>
        </div>

        <div class="split">
          <div class="card">
            <h2>Hasil</h2>
            <div id="summary-stats"></div>
            <div
              class="chart-controls"
              id="filter-controls"
              style="display: none"
            >
              <select id="filter-col"></select>
              <select id="filter-val"></select>
              <button id="filter-clear">✕ Clear</button>
            </div>
            <div class="scroll" id="result-area">
              <div class="empty">Upload file lalu jalankan query.</div>
            </div>
          </div>
          <div class="card">
            <h2>Chart</h2>
            <div class="chart-controls">
              <select id="chart-type">
                <option value="bar">Bar</option>
                <option value="line">Line</option>
                <option value="scatter">Scatter</option>
                <option value="pie">Pie</option>
              </select>
              <select id="chart-x">
                <option>x</option>
              </select>
              <select id="chart-y">
                <option>y</option>
              </select>
              <button id="export-csv-btn">Export CSV</button>
              <button id="export-png-btn">Export PNG</button>
              <button id="pin-chart-btn">+ Pin ke Dashboard</button>
            </div>
            <div class="scroll" style="flex: 1">
              <canvas id="chart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
