<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Observatory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Data Observatory</h1>
      <button id="dashboard-toggle" style="font-size: 12px">Dashboard</button>
      <span class="status" id="status">memuat mesin query…</span>
    </header>

    <div
      id="dashboard-view"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 50;
        padding: 20px;
        overflow: auto;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        "
      >
        <h2 style="font-size: 14px; margin: 0">Dashboard</h2>
        <button id="dashboard-close">✕ Tutup</button>
      </div>
      <div
        id="dashboard-grid"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
          gap: 14px;
        "
      ></div>
    </div>

    <div class="layout">
      <div class="sidebar">
        <div>
          <h2>Tabel</h2>
          <div id="file-list" style="margin-top: 8px"></div>
        </div>
        <button id="upload-btn">+ Upload CSV / JSON</button>
        <button id="save-project-btn">Save Project</button>
        <button id="load-project-btn">Load Project</button>
        <input
          type="file"
          id="project-input"
          accept=".json"
          style="display: none"
        />
        <input type="file" id="file-input" accept=".csv,.json" multiple />
      </div>

      <div class="main">
        <div class="card" style="flex: 0 0 auto">
          <h2>Query SQL</h2>
          <textarea
            id="sql"
            spellcheck="false"
            placeholder="select * from nama_tabel limit 100;"
          ></textarea>
          <div class="editor-footer">
            <select id="query-history" style="max-width: 200px">
              <option value="">Riwayat query…</option>
            </select>
            <span class="hint" id="table-hint">belum ada tabel</span>
            <button id="template-toggle" style="font-size: 12px">
              📋 Template
            </button>
            <button id="ai-toggle" style="font-size: 12px">✨ AI</button>
            <button id="run-btn" disabled>Jalankan ▸</button>
          </div>
          <div
            id="ai-panel"
            style="
              display: none;
              margin-top: 10px;
              padding: 10px;
              background: var(--panel2);
              border-radius: 6px;
            "
          >
            <div
              style="
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
                flex-wrap: wrap;
              "
            >
              <select id="ai-provider">
                <option value="gemini">Gemini</option>
                <option value="groq">Groq</option>
              </select>
              <input
                id="ai-key"
                type="password"
                placeholder="API key kamu"
                style="
                  flex: 1;
                  min-width: 160px;
                  background: var(--panel);
                  border: 1px solid var(--border);
                  color: var(--text);
                  border-radius: 5px;
                  padding: 5px 8px;
                  font-size: 12px;
                "
              />
            </div>
            <div style="display: flex; gap: 8px">
              <input
                id="ai-prompt"
                type="text"
                placeholder="contoh: total revenue per region"
                style="
                  flex: 1;
                  background: var(--panel);
                  border: 1px solid var(--border);
                  color: var(--text);
                  border-radius: 5px;
                  padding: 6px 8px;
                  font-size: 13px;
                "
              />
              <button id="ai-ask">Tanya</button>
            </div>
            <div
              id="ai-status"
              style="
                font-size: 11px;
                color: var(--text-muted);
                margin-top: 6px;
                font-family: var(--mono);
              "
            ></div>
          </div>
          <div
            id="template-panel"
            style="
              display: none;
              margin-top: 10px;
              padding: 10px;
              background: var(--panel2);
              border-radius: 6px;
            "
          >
            <div style="display: flex; gap: 8px; margin-bottom: 8px">
              <select id="template-table" style="flex: 1"></select>
            </div>
            <div
              id="template-list"
              style="display: flex; flex-direction: column; gap: 4px"
            ></div>
          </div>
        </div>

        <div class="split">
          <div class="card">
            <h2>Hasil</h2>
            <div
              class="chart-controls"
              id="filter-controls"
              style="display: none"
            >
              <select id="filter-col"></select>
              <select id="filter-val"></select>
              <button id="filter-clear" style="font-size: 12px">✕ Clear</button>
            </div>
            <div
              id="summary-stats"
              style="
                font-size: 11px;
                font-family: var(--mono);
                color: var(--text-muted);
                margin-bottom: 8px;
              "
            ></div>
            <div class="scroll" id="result-area">
              <div class="empty">Upload file lalu jalankan query.</div>
            </div>
          </div>
          <div class="card">
            <h2>Chart</h2>
            <div class="chart-controls">
              <select id="chart-type">
                <option value="bar">Bar</option>
                <option value="line">Line</option>
                <option value="scatter">Scatter</option>
                <option value="pie">Pie</option>
              </select>
              <select id="chart-x">
                <option>x</option>
              </select>
              <select id="chart-y">
                <option>y</option>
              </select>
              <button id="export-csv-btn">Export CSV</button>
              <button id="export-png-btn">Export PNG</button>
              <button id="pin-chart-btn" style="font-size: 12px">
                + Pin ke Dashboard
              </button>
            </div>
            <div class="scroll" style="flex: 1">
              <canvas id="chart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
